site_name: 宇树 G1 使用手册
site_description: 面向初学者的宇树 G1 使用指南
site_author: YFRL
site_url: https://yfrobotics.github.io/unitree-g1-handbook/
strict: true
repo_url: https://github.com/yfrobotics/unitree-g1-handbook
repo_name: yfrobotics/unitree-g1-handbook

edit_uri: edit/main/docs/

hooks:
  - scripts/seo.py

theme:
  name: material
  custom_dir: overrides
  language: zh
  logo: ""
  features:
    - navigation.indexes
    - navigation.top
    - navigation.tracking
    - toc.follow
  palette:
    primary: white
    accent: red
  include_search_page: false
  search_index_only: true
  font:
    text: Fira Sans
    code: Fira Mono

plugins:
  - search:
      separator: '[\s\u200b\-,:!=\[\]()"/]+|(?!\b)(?=[A-Z][a-z])|\.(?!\d)|&[lg]t;'
      lang:
        - zh
        - en
  - git-revision-date-localized:
      type: date
      locale: zh
      fallback_to_build_date: true

extra_javascript:
  - _static/js/mathjaxhelper.js
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js

extra:
  analytics:
    provider: google
    property: G-1E03P4K9QL

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.superfences:
      custom_fences:
        - name: math
          class: arithmatex
          format: !!python/name:pymdownx.arithmatex.fence_mathjax_format
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - attr_list
  - md_in_html

nav:
  - 首页: index.md
  - '1. 入门指南':
      - getting-started/index.md
      - 开箱: getting-started/unboxing.md
      - 遥控器使用: getting-started/remote-control.md
      - 安全指南: getting-started/safety.md
  - '2. 网络连接':
      - networking/index.md
      - 连接机器人: networking/connect-to-robot.md
      - 连接互联网: networking/connect-to-internet.md
  - '3. 开发指南':
      - development/index.md
      - SDK 配置: development/sdk-setup.md
      - 灵巧手 SDK 与操作: development/hand-sdk.md
      - ROS2 集成: development/ros2.md
      - 仿真: development/simulation.md
  - '4. 具身学习':
      - learning/index.md
      - 开源数据集集合: learning/datasets.md
      - VLA：视觉、语言与动作: learning/vla.md
      - SONIC 与全身运动学习: learning/whole-body.md
  - '5. 硬件':
      - hardware/index.md
      - 规格与组件: hardware/specs.md
      - 传感器与感知: hardware/sensors.md
  - '6. 故障排查': troubleshooting.md
