site_name: 宇树 G1 使用手册
site_description: 面向初学者的宇树 G1 使用指南
site_url: ""
repo_url: https://github.com/yfrobotics/unitree-g1-handbook
repo_name: yfrobotics/unitree-g1-handbook

theme:
  name: material
  language: zh
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: 切换至深色模式
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: 切换至浅色模式
  features:
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - attr_list
  - md_in_html

nav:
  - 首页: index.md
  - 入门指南:
      - 开箱: getting-started/unboxing.md
      - 遥控器使用: getting-started/remote-control.md
      - 安全指南: getting-started/safety.md
  - 网络连接:
      - 连接机器人: networking/connect-to-robot.md
      - 连接互联网: networking/connect-to-internet.md
  - 开发指南:
      - SDK 配置: development/sdk-setup.md
      - 灵巧手 SDK 与操作: development/hand-sdk.md
      - ROS2 集成: development/ros2.md
      - 仿真: development/simulation.md
  - 具身学习:
      - 开源数据集集合: learning/datasets.md
      - VLA：视觉、语言与动作: learning/vla.md
  - 硬件:
      - 规格与组件: hardware/specs.md
      - 传感器与感知: hardware/sensors.md
  - 故障排查: troubleshooting.md
