name: Check handbook

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s examples/tests -v
      - run: python examples/convert_brainco2.py --raw-dir examples/data/synthetic --repo-id local/schema-check --check-only
      - run: mkdocs build --strict
      - run: python scripts/check_seo.py
